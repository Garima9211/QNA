<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="css/edit_profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="page-padding">

    <div class="edit-container">
        <h1 class="page-heading">Edit Profile</h1>
        
        <form id="profileForm" class="form-stack">
            
            <div class="pro-card">
                <h2 class="card-heading">Personal Information</h2>
                <div class="form-grid">
                    <input id="name" class="form-input" placeholder="Full Name">
                    <input id="username" class="form-input" placeholder="Username">
                    <input id="email" type="email" class="form-input" placeholder="Email">
                    <input id="phone" class="form-input" placeholder="Mobile">
                    <input id="dob" type="date" class="form-input">
                    <select id="gender" class="form-input">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                    <input id="blood" class="form-input" placeholder="Blood Group">
                    <input id="language" class="form-input" placeholder="Language">
                </div>
            </div>

            <div class="pro-card">
                <h2 class="card-heading">Address</h2>
                <div class="form-grid">
                    <input id="country" class="form-input" placeholder="Country">
                    <input id="state" class="form-input" placeholder="State">
                    <input id="city" class="form-input" placeholder="City">
                    <input id="pincode" class="form-input" placeholder="Pincode">
                    <textarea id="address" class="form-input" placeholder="Address"></textarea>
                </div>
            </div>

            <div class="pro-card">
                <h2 class="card-heading">Education</h2>
                <div class="form-grid">
                    <input id="qualification" class="form-input" placeholder="Qualification">
                    <input id="college" class="form-input" placeholder="College">
                    <input id="course" class="form-input" placeholder="Course">
                    <input id="year" class="form-input" placeholder="Year">
                    <input id="exam" class="form-input" placeholder="Target Exam">
                    <input id="hours" class="form-input" placeholder="Study Hours">
                </div>
            </div>

            <div class="action-row">
                <button type="submit" class="btn-block btn-blue">Save Changes</button>
                <a href="profile.html" class="btn-block btn-gray">Cancel</a>
            </div>

        </form>
    </div>

    <script>
        let u = JSON.parse(localStorage.getItem("user")) || {};
        const ids = ["name","username","email","phone","dob","gender","blood","language","country","state","city","pincode","address","qualification","college","course","year","exam","hours"];
        
        ids.forEach(id => {
            let e = document.getElementById(id);
            if(e && u[id]) e.value = u[id];
        });

        document.getElementById("profileForm").onsubmit = e => {
            e.preventDefault();
            ids.forEach(id => {
                let el = document.getElementById(id);
                if(el) u[id] = el.value;
            });

            if(!u.photo) u.photo = "https://api.dicebear.com/7.x/avataaars/svg?seed=" + encodeURIComponent(u.name || "User");
            
            localStorage.setItem("user", JSON.stringify(u));
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let i = users.findIndex(x => x.email === u.email);
            
            if(i >= 0) users[i] = u;
            else users.push(u);

            localStorage.setItem("users", JSON.stringify(users));
            alert("Profile Updated");
            location.href = "profile.html";
        };
    </script>
</body>
</html>
