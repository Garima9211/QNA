<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The QNA Dynamic Tests</title>

<!-- Font Awesome CDN Icons ke liye -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* Dark Theme Base Styles */
    :root {
        --bg-main: #0d0f17;
        --bg-card: #161b26;
        --bg-option: #212836;
        --border-color: #2e374a;
        --text-primary: #ffffff;
        --text-secondary: #9da8be;
        --accent-purple: #8b5cf6;
        --accent-green: #10b981;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
    }

    /* Header */
    header {
        background-color: #090a0f;
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 12px 16px;
    }

    .header-inner {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo-box {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo-icon {
        background: var(--accent-purple);
        color: white;
        font-weight: bold;
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 20px;
    }

    .logo-title {
        font-size: 20px;
        color: #fff;
    }

    .logo-title span {
        color: var(--accent-purple);
    }

    .icon-btn {
        background: #1e2430;
        border: none;
        color: white;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Main Container */
    .main-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
    }

    /* Filters */
    .filters-wrapper {
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 8px;
    }

    .mobile-filter-container {
        display: flex;
        gap: 10px;
    }

    .filter-box {
        background-color: var(--bg-card);
        color: var(--text-secondary);
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s ease;
    }

    .filter-box.active, .filter-box:hover {
        background-color: var(--accent-purple);
        color: white;
        border-color: var(--accent-purple);
    }

    /* Test Cards */
    .tests-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .test-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .unlocked-badge {
        background-color: rgba(16, 185, 129, 0.15);
        color: var(--accent-green);
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: 600;
    }

    .test-id {
        color: var(--text-secondary);
        font-size: 14px;
    }

    .question-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 14px;
        color: var(--text-primary);
    }

    /* Options */
    .options-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 16px;
    }

    .option-item {
        background-color: var(--bg-option);
        border: 1px solid var(--border-color);
        padding: 12px 14px;
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .option-item:hover {
        border-color: var(--accent-purple);
    }

    .option-item.selected {
        background-color: rgba(139, 92, 246, 0.2);
        border-color: var(--accent-purple);
        color: #ffffff;
    }

    /* Continue Button */
    .continue-btn {
        display: block;
        text-align: center;
        background-color: var(--accent-purple);
        color: white;
        text-decoration: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: 600;
        transition: background-color 0.2s;
    }

    .continue-btn:hover {
        background-color: #7c3aed;
    }

    .empty-msg {
        text-align: center;
        color: var(--text-secondary);
        padding: 40px 0;
    }
</style>
</head>

<body> 
    <!-- Header -->
    <header>
        <div class="header-inner">
            <div class="logo-box">
                <div class="logo-icon">Q</div>
                <h1 class="logo-title">The <span>QNA</span></h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openProfile()" aria-label="Profile">
                    <i class="fa-regular fa-user"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Filters -->
        <div class="filters-wrapper">
            <div class="mobile-filter-container" id="mobileFilters"></div>
        </div>

        <!-- Tests Container -->
        <div id="tests" class="tests-grid"></div>
    </div>

<script>
const sampleOptions = [
  "A. बहादुर शाह जफर",
  "B. रानी लक्ष्मीबाई",
  "C. कुंवर सिंह",
  "D. तात्या टोपे"
];

const data = [];
for(let i=1000; i>=986; i--) { 
 data.push({
   id: i,
   question: "1857 की क्रांति का नेतृत्व किसने किया?",
   options: [...sampleOptions]
 });
}

const box = document.getElementById("tests");
const filterContainer = document.getElementById('mobileFilters');

const filterRanges = [
  "951-1000", // Range ko data se match karne ke liye update kiya
  "901-950", 
  "851-900", 
  "801-850"
];

function initFilters() {
    filterContainer.innerHTML = ''; 
    
    filterRanges.forEach((range, idx) => {
        const btn = document.createElement('div');
        btn.className = idx === 0 ? 'filter-box active' : 'filter-box';
        btn.innerText = range;
        
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-box').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            if (range === "📑 सभी टेस्ट") {
                renderTests(data);
            } else {
                const parts = range.split('-');
                const min = parseInt(parts[0]);
                const max = parseInt(parts[1]);
                
                const filteredData = data.filter(test => test.id >= min && test.id <= max);
                renderTests(filteredData);
            }
        });
        
        filterContainer.appendChild(btn);
    });
}

function renderTests(testsToShow) {
    box.innerHTML = ""; 
    
    if(testsToShow.length === 0) {
        box.innerHTML = `<p class="empty-msg">इस रेंज में कोई टेस्ट उपलब्ध नहीं है।</p>`;
        return;
    }

    testsToShow.forEach(test => {
        const card = document.createElement("div");
        card.className = "test-card";

        card.innerHTML = `
        <div>
            <div class="card-header">
                <span class="unlocked-badge">Unlocked</span>
                <span class="test-id">टेस्ट #${test.id}</span>
            </div>

            <div class="question-box">
                <p class="question-title">Q1: ${test.question}</p>
                <div class="options-grid options"></div>
            </div>
        </div>

        <a href="upi.html" class="continue-btn">
            टेस्ट जारी रखें
        </a>
        `;

        const optBox = card.querySelector(".options");

        test.options.forEach(op => {
            const div = document.createElement("div");
            div.className = "option-item";
            div.textContent = op;

            div.onclick = function() {
                optBox.querySelectorAll("div").forEach(x => {
                    x.className = "option-item";
                });
                this.className = "option-item selected";
            };

            optBox.appendChild(div);
        });

        box.appendChild(card);
    });
}

function openProfile() {
    alert("Profile Clicked!");
}

initFilters();
renderTests(data.filter(test => test.id >= 951 && test.id <= 1000));
</script>
</body>
</html>
