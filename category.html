<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The QNA Dynamic Tests</title>

<!-- Font Awesome CDN Icons ke liye -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/category.css">


</head>

<body> 
    <!-- Header -->
    <header>
        <div class="header-inner">
            <div class="logo-box">
                <div class="logo-icon">Q</div>
                <h1 class="logo-title">The <span>QNA</span></h1>
            </div>
            <div class="header-actions">
                <a href="./wallet.html" class="nav-item">
                <button class="icon-btn" onclick="openWallet()" aria-label="wallet">
                    <i class="fa-solid fa-wallet"></i>
                </button>
                </a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Filters -->
        <div class="filters-wrapper">
            <div class="mobile-filter-container" id="mobileFilters"></div>
        </div>

        <!-- Tests Container -->
        <div id="tests" class="tests-grid"></div>
    </div>

     <!-- Bottom Fixed Navigation Bar -->
    <nav>
        <div class="app-container nav-inner">
            <a href="./index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span class="nav-label">Home</span>
                
            </a>
            <a href="./feed.html" class="nav-item">
                <i class="fa-solid fa-bolt"></i>
                <span class="nav-label">Feed</span>
            </a>
            <div class="fab-wrapper">
                <a href="./offer.html" aria-label="Add Question" class="pro-fab">
                    <span class="nav-label">My Offer</span>
                </a>
            </div>
            <a href="./category.html" class="nav-item">
                <i class="fa-solid fa-layer-group"></i>
                <span class="nav-label">Test</span>
            </a>
            <a href="login.html" onclick="openProfile()" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span class="nav-label">Me</span>
            </a>
        </div>
    </nav>
<script>
const sampleOptions = [
  "A. बहादुर शाह जफर",
  "B. रानी लक्ष्मीबाई",
  "C. कुंवर सिंह",
  "D. तात्या टोपे"
];

const data = [];
for(let i=1000; i>=986; i--) { 
 data.push({
   id: i,
   question: "1857 की क्रांति का नेतृत्व किसने किया?",
   options: [...sampleOptions]
 });
}

const box = document.getElementById("tests");
const filterContainer = document.getElementById('mobileFilters');

const filterRanges = [
  "1-50", // Range ko data se match karne ke liye update kiya
  "51-100", 
  "101-150", 
  "151-200"
];

function initFilters() {
    filterContainer.innerHTML = ''; 
    
    filterRanges.forEach((range, idx) => {
        const btn = document.createElement('div');
        btn.className = idx === 0 ? 'filter-box active' : 'filter-box';
        btn.innerText = range;
        
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-box').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            if (range === "📑 सभी टेस्ट") {
                renderTests(data);
            } else {
                const parts = range.split('-');
                const min = parseInt(parts[0]);
                const max = parseInt(parts[1]);
                
                const filteredData = data.filter(test => test.id >= min && test.id <= max);
                renderTests(filteredData);
            }
        });
        
        filterContainer.appendChild(btn);
    });
}

function renderTests(testsToShow) {
    box.innerHTML = ""; 
    
    if(testsToShow.length === 0) {
        box.innerHTML = `<p class="empty-msg">इस रेंज में कोई टेस्ट उपलब्ध नहीं है।</p>`;
        return;
    }

    testsToShow.forEach(test => {
        const card = document.createElement("div");
        card.className = "test-card";

        card.innerHTML = `
        <div>
            <div class="card-header">
                <span class="unlocked-badge">Unlocked</span>
                <span class="test-id">टेस्ट #${test.id}</span>
            </div>

            <div class="question-box">
                <p class="question-title">Q1: ${test.question}</p>
                <div class="options-grid options"></div>
            </div>
        </div>

        <a href="upi.html" class="continue-btn">
            टेस्ट जारी रखें
        </a>
        `;

        const optBox = card.querySelector(".options");

        test.options.forEach(op => {
            const div = document.createElement("div");
            div.className = "option-item";
            div.textContent = op;

            div.onclick = function() {
                optBox.querySelectorAll("div").forEach(x => {
                    x.className = "option-item";
                });
                this.className = "option-item selected";
            };

            optBox.appendChild(div);
        });

        box.appendChild(card);
    });
}

function openProfile() {
    alert("Profile Clicked!");
}

initFilters();
renderTests(data.filter(test => test.id >= 951 && test.id <= 1000));
</script>
</body>
</html>
