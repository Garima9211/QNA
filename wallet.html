<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375, user-scalable=no">
    <title>The QNA Store</title>
    <link rel="stylesheet" href="css/wallet.css">
    
</head>
<body>

    <div class="mobile-frame">
        <div class="notch"></div>

        <!-- 1. Header (Designer Space) -->
        <div class="header-placeholder">
            [ Designer: Insert App Header Here ]
        </div>

        <!-- 2. स्क्रॉल होने वाला मुख्य पेज -->
        <div class="content">

            <!-- टॉप बैलेंस कार्ड -->
            <div class="balance-card">
                <div class="balance-left">
                    <div class="coin-icon">P</div>
                    <div class="balance-text">
                        <div class="low-balance">Low Coin balance</div>
                        <div class="coins">0 Coins</div>
                    </div>
                </div>
                <div class="arrow-right">›</div>
            </div>

            <!-- My Coin History बटन -->
            <div class="history-btn" onclick="alert('Coin History पेज यहाँ खुलेगा')">
                <div class="history-left">
                    <div class="history-icon">📜</div>
                    <div class="history-text">My Coin History</div>
                </div>
                <div class="arrow-right">›</div>
            </div>

            <!-- Watch Ads सेक्शन (1 Ad = 10 Coins) -->
            <div class="section-title">Watch ads and earn coins</div>
            
            <!-- 1 Ad = 10 Coins -->
            <div class="list-item">
                <div class="item-left">
                    <div class="coin-amount"><span class="small-coin">P</span> 10 <span class="sub-text">coins</span></div>
                </div>
                <button class="action-btn">1 ad</button>
            </div>

            <!-- 7 Ads = 100 Coins (43% Bonus) -->
            <div class="list-item">
                <div class="item-left">
                    <div class="bonus-tag">43% bonus</div>
                    <div class="coin-amount"><span class="small-coin">P</span> 100 <span class="sub-text">coins</span></div>
                </div>
                <button class="action-btn">7 ads</button>
            </div>

            <!-- 13 Ads = 200 Coins (54% Bonus) -->
            <div class="list-item" style="border-bottom: none;">
                <div class="item-left">
                    <div class="bonus-tag">54% bonus</div>
                    <div class="coin-amount"><span class="small-coin">P</span> 200 <span class="sub-text">coins</span></div>
                </div>
                <button class="action-btn">13 ads</button>
            </div>

            <!-- लिमिटेड टाइम ऑफर (3000 Coins / ₹49) -->
            <div class="section-title">Limited Time Offer</div>
            
            <div class="offer-card">
                <div>
                    <div class="offer-tag">Mega Saver Pack</div>
                    <div class="coin-amount"><span class="small-coin">P</span> 3000 <span class="sub-text">coins</span></div>
                </div>
                <button class="action-btn green-btn">
                    ₹49
                </button>
            </div>

        </div>

        <!-- 3. फुटर / नेविगेशन के लिए खाली जगह (Designer Space) -->
        <div class="footer-placeholder">
            [ Designer: Insert Bottom Navigation Here ]
        </div>

    </div>

</body>
</html>
