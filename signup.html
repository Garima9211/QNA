<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Google</title>
    <!-- अलग से बनाई गई CSS फाइल को लिंक किया गया है -->
    <link rel="stylesheet" href="css/signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <h1 class="login-heading">Welcome Back</h1>
            <p class="login-subheading">Sign in using your Google account to continue.</p>
            
            <!-- Google Login Button Configuration -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="continue_with"
                 data-shape="rectangular"
                 data-logo_alignment="center">
            </div>
        </div>
    </div>

    <script>
        // Google से मिले JWT Token को डिकोड करने का फंक्शन
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // जब लॉगिन सक्सेसफुल हो जाएगा तब यह फंक्शन चलेगा
        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);

            // सिर्फ Name, Email और Photo ले रहे हैं (Mobile Number नहीं)
            let u = {
                name: responsePayload.name,
                email: responsePayload.email,
                photo: responsePayload.picture
            };

            // LocalStorage में यूज़र का डेटा सेव करें
            localStorage.setItem("user", JSON.stringify(u));
            
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let i = users.findIndex(x => x.email === u.email);
            
            if(i >= 0) {
                users[i] = u; // अगर पहले से है तो अपडेट करें
            } else {
                users.push(u); // नया यूज़र है तो ऐड करें
            }

            localStorage.setItem("users", JSON.stringify(users));

            // लॉगिन के बाद प्रोफाइल पेज पर भेजें
            window.location.href = "profile.html";
        }
    </script>
</body>
</html>
