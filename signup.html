<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The QNA - Sign Up</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>

    <div class="signup-card">
        <div class="header-box">
            <div class="logo-avatar">Q</div>
            <h1 class="app-title">The QNA</h1>
            <p class="app-subtitle">Create your account to start</p>
        </div>

        <div class="form-group">
            <input 
                id="name" 
                class="custom-input" 
                placeholder="Full Name" 
                autocomplete="name">
                
            <input 
                id="email" 
                type="email" 
                class="custom-input" 
                placeholder="Email Address" 
                autocomplete="email">
                
            <input 
                id="phone" 
                type="tel" 
                maxlength="10" 
                class="custom-input" 
                placeholder="Mobile Number" 
                autocomplete="tel">
        </div>

        <button id="continueBtn" class="btn-primary">
            Continue
        </button>

        <div class="divider-box">
            <div class="divider-line"></div>
            <span class="divider-text">OR</span>
            <div class="divider-line"></div>
        </div>

        <!-- Google Signup Button -->
        <button id="googleBtn" class="btn-google">
            <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <script>
        // Already Logged In Check
        if(localStorage.getItem("user")){
            location.href = "index.html"; // Redirect to home/profile if already logged in
        }

        const contBtn = document.getElementById("continueBtn");
        const googBtn = document.getElementById("googleBtn");

        // 1. Manual Form Signup / Login
        function manualLogin() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();

            if(!name || !email || !phone){
                alert("Please fill all fields.");
                return;
            }

            if(phone.length < 10){
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            processUserLogin({
                name: name,
                email: email,
                phone: phone
            }, contBtn);
        }

        // 2. Google Signup / Login (Simulated for Frontend)
        function googleLogin() {
            // NOTE: In a real app, you will integrate Google Identity Services here.
            // For now, this mocks a successful Google sign-in.
            
            // Simulating Google picking up user details
            const mockGoogleUser = {
                name: "Google User",
                email: "user@gmail.com",
                phone: "Not Provided" 
            };

            processUserLogin(mockGoogleUser, googBtn);
        }

        // Core Login Logic
        function processUserLogin(userData, btnElement) {
            const user = {
                id: Date.now(),
                name: userData.name,
                email: userData.email,
                phone: userData.phone,
                photo: "https://api.dicebear.com/7.x/avataaars/svg?seed=" + encodeURIComponent(userData.name),
                rank: "#142",
                accuracy: "86%",
                tests: "24"
            };

            // Get Existing Users
            let users = JSON.parse(localStorage.getItem("users")) || [];

            // Check Existing Email
            const existingUser = users.find(u => u.email === userData.email);

            if(existingUser){
                // Login existing user
                localStorage.setItem("user", JSON.stringify(existingUser));
            } else {
                // Signup new user
                users.push(user);
                localStorage.setItem("users", JSON.stringify(users));
                localStorage.setItem("user", JSON.stringify(user));
            }

            // Disable Buttons and show loading state
            contBtn.disabled = true;
            googBtn.disabled = true;
            
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = "Signing In...";
            btnElement.style.opacity = "0.7";

            setTimeout(() => {
                location.href = "profile.html";
            }, 1500);
        }

        // Attach Event Listeners
        document.getElementById("continueBtn").onclick = manualLogin;
        document.getElementById("googleBtn").onclick = googleLogin;
    </script>
</body>
</html>
