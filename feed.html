<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt Jobs GK Test - The QNA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/feed.css">
</head>
<body>

<!-- Reels Container -->
    <main id="reels-wrapper" class="reels-container">
        <!-- Sticky Header Ad -->
        <div class="header-ad">
            <div class="ad-box-320">Header Ad Space (320 x 50)</div>
        </div>

        <!-- Dynamic Questions Loop -->
        <div id="reels-content"></div>
    </main>

    <!-- Bottom Explanation Sheet -->
    <div id="sheet-overlay" class="sheet-overlay hidden" onclick="closeExplanation()"></div>
    
    <div id="explanation-sheet" class="explanation-sheet">
        <div class="sheet-header">
            <div class="drag-handle" onclick="closeExplanation()"></div>
            <div class="sheet-title-bar">
                <h3>📖 विस्तृत व्याख्या</h3>
                <button onclick="closeExplanation()" class="close-btn">बंद करें ✕</button>
            </div>
        </div>
        
        <div class="sheet-body">
            <div id="explanation-text" class="explanation-text"></div>
            <div class="ad-box-300">
                <span class="sponsored-tag">Sponsored</span>
                <span class="ad-icon">📢</span>
                <b>Context Ad Space</b>
                <small>(300 x 250)</small>
            </div>
        </div>

        <div class="sheet-footer">
            <button onclick="nextFromExplanation()" class="primary-btn">अगला सवाल ➡️</button>
        </div>
    </div>

    <!-- Full Screen Video Ad Overlay -->
    <div id="video-ad-overlay" class="video-overlay hidden">
        <div class="ad-top-bar">
            <span class="sponsored-badge">Sponsored Video</span>
            <div id="ad-countdown" class="ad-timer">Ad ends in <span id="v-time">5</span>s</div>
        </div>
        
        <div class="video-player-mock">
            <span class="play-icon">▶️</span>
            <h3>Video Ad Slot</h3>
            <p>True Full Screen Interstitial</p>
        </div>
        
        <div id="skip-btn-container" class="skip-container hidden">
            <button onclick="skipVideoAd()" class="skip-btn">Skip Ad ⏭️</button>
        </div>
    </div>
    <!-- === 3. Bottom Navigation Bar=== -->
    <nav>
        <div class="app-container nav-inner">
            <a href="./index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span class="nav-label nav-label-active">Home</span>
                
            </a>

            <a href="./feed.html" class="nav-item">
                <i class="fa-solid fa-bolt"></i>
                <span class="nav-label">Feed</span>
            </a>

            <!-- <div class="fab-wrapper">
                <a href="./offer.html" aria-label="Add Question" class="pro-fab">
                    <i class="fa-solid fa-plus">Offer</i>
                </a>
            </div> -->
        <div class="fab-wrapper">
          <a href="./offer.html" aria-label="Add Question" class="pro-fab">
               <!-- <i class="fa-solid fa-plus"></i> -->
                <span class="nav-label">My Offer</span>
            </a>
         </div>

            <a href="./category.html" class="nav-item">
                <i class="fa-solid fa-layer-group"></i>
                <span class="nav-label">Test</span>
            </a>

            <a href="login.html" onclick="openProfile()" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span class="nav-label">Me</span>
            </a>
        </div>
    </nav>

    <script src="js/script.js"></script>
</body>
</html>
