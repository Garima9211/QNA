<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QNA Shorts - Mobile View</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>

    <!-- मुख्य मोबाइल स्क्रीन फ्रेम Container -->
    <div class="mobile-wrapper">
        
        <!-- ऐप हेडर (Header) -->
        <header class="app-header">
            <div class="header-inner">
                <div class="logo-box">
                    <div class="logo-icon">Q</div>
                    <h1 class="logo-title">The <span>QNA</span></h1>
                </div>

                <div class="header-actions">
                    <button class="icon-btn" onclick="openProfile()" aria-label="Profile">
                        <i class="fa-regular fa-user"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- मुख्य रील्स स्क्रोलिंग एरिया -->
        <main id="reelsContainer" class="reels-container no-scrollbar"></main>

        <!-- बॉटम नेविगेशन बार (Mobile Bottom Nav) -->
        <nav class="bottom-nav">
            <div class="nav-inner">
                <a href="./index.html" class="nav-item active">
                    <i class="fa-solid fa-house"></i>
                    <span class="nav-label">Home</span>
                    <div class="active-dot"></div>
                </a>

                <a href="./feed.html" class="nav-item">
                    <i class="fa-solid fa-bolt"></i>
                    <span class="nav-label">Feed</span>
                </a>

                <div class="fab-wrapper">
                    <a href="https://theqna.in/" aria-label="Add Question" class="pro-fab">
                        <i class="fa-solid fa-plus"></i>
                    </a>
                </div>

                <a href="./category.html" class="nav-item">
                    <i class="fa-solid fa-layer-group"></i>
                    <span class="nav-label">Test</span>
                </a>

                <a href="#" onclick="openProfile()" class="nav-item">
                    <i class="fa-regular fa-user"></i>
                    <span class="nav-label">Me</span>
                </a>
            </div>
        </nav>

        <!-- विज्ञापन मोडल (Ad Modal) -->
        <div id="adModal" class="modal-overlay">
            <div class="ad-modal-content">
                <button onclick="closeAd()" class="close-ad-btn" aria-label="Close Ad">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <span class="ad-tag">Advertisement</span>
                <div class="ad-card">
                    <i class="fa-brands fa-google ad-icon"></i>
                    <h3 class="ad-title">Your Sponsored Ad Here</h3>
                    <p class="ad-desc">यह फुल-स्क्रीन विज्ञापन रिवेन्यू जनरेट करेगा। यूज़र इसे देखकर ही पूरी जानकारी पढ़ सकेगा।</p>
                    <button onclick="closeAd()" class="skip-btn">Skip Ad</button>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript File -->
    <script src="js/app.js"></script>
</body>
</html>
