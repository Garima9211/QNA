<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment History - The QNA</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/payment.css">
</head>

<body>

<!-- Header -->
<header>
    <div class="header-container">
        <div class="logo-group">
            <div class="logo-icon">Q</div>
            <h1 class="logo-text">The <span>QNA</span></h1>
        </div>
        <h2 class="header-title">💳 Wallet History</h2>
    </div>
</header>

<div class="container">

    <!-- Summary -->
    <div class="summary-grid">
        <div class="summary-card">
            <p class="summary-label">Total Payments</p>
            <h2 class="summary-value">8</h2>
        </div>

        <div class="summary-card">
            <p class="summary-label">Successful</p>
            <h2 class="summary-value text-success">₹3,200</h2>
        </div>

        <div class="summary-card">
            <p class="summary-label">Pending</p>
            <h2 class="summary-value text-pending">2</h2>
        </div>
    </div>

    <!-- Search -->
    <input
        id="search"
        type="text"
        placeholder="Search Transaction ID..."
        class="search-input">

    <!-- Filter -->
    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="success">Success</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="failed">Failed</button>
    </div>

    <!-- Payments List -->
    <div id="payments" class="payments-list"></div>

    <!-- Empty State -->
    <div id="empty" class="empty-state hidden">
        No Payment Found 😔
    </div>

</div>

<script>
const payments = [
    {
        id: "TXN458920",
        date: "06 Jul 2026 • 10:45 AM",
        amount: 499,
        method: "UPI",
        status: "success"
    },
    {
        id: "TXN458921",
        date: "05 Jul 2026 • 8:10 PM",
        amount: 299,
        method: "Card",
        status: "pending"
    },
    {
        id: "TXN458922",
        date: "04 Jul 2026 • 1:35 PM",
        amount: 999,
        method: "UPI",
        status: "failed"
    },
    {
        id: "TXN458923",
        date: "03 Jul 2026 • 11:30 AM",
        amount: 799,
        method: "UPI",
        status: "success"
    }
];

const box = document.getElementById("payments");
const search = document.getElementById("search");
let current = "all";

function render() {
    box.innerHTML = "";

    const list = payments.filter(x => {
        const s = x.id.toLowerCase().includes(search.value.toLowerCase());
        const f = current === "all" || x.status === current;
        return s && f;
    });

    document.getElementById("empty").classList.toggle("hidden", list.length > 0);

    list.forEach(x => {
        let badgeClass = "";

        if (x.status === "success") badgeClass = "badge-success";
        if (x.status === "pending") badgeClass = "badge-pending";
        if (x.status === "failed") badgeClass = "badge-failed";

        box.innerHTML += `
        <div class="payment-card">
            <div class="card-top">
                <div>
                    <h3 class="txn-id">${x.id}</h3>
                    <p class="txn-date">${x.date}</p>
                </div>
                <span class="status-badge ${badgeClass}">
                    ${x.status}
                </span>
            </div>

            <div class="card-bottom">
                <div>
                    <p class="meta-label">Method</p>
                    <p class="meta-value">${x.method}</p>
                </div>
                <div class="text-right">
                    <p class="meta-label">Amount</p>
                    <p class="amount-value">₹${x.amount}</p>
                </div>
            </div>
        </div>
        `;
    });
}

render();

search.oninput = render;

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        current = this.dataset.filter;
        render();
    }
});
</script>

</body>
</html>
